<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>직영점 AS 수거 신청</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #1f2328;
        --muted: #687076;
        --line: #dfe3e8;
        --brand: #111111;
        --brand-soft: #f0f2f4;
        --ok: #008a4e;
        --warn: #c96b00;
        --danger: #c73535;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", sans-serif;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      .wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 20px;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: 0;
      }
      .sub {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .card {
        padding: 18px;
      }
      .grid {
        display: grid;
        gap: 12px;
      }
      .top-grid {
        grid-template-columns: 1.4fr 1fr 1fr;
      }
      .auth-grid {
        grid-template-columns: minmax(0, 1fr) 190px 120px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 40px;
        border: 1px solid #cfd6dd;
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 8px 10px;
      }
      textarea {
        min-height: 40px;
        resize: vertical;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 40px;
        border: 1px solid #cfd6dd;
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        padding: 8px 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn.primary {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }
      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin: 18px 0;
      }
      .tab {
        border: 1px solid var(--line);
        background: #fff;
      }
      .tab.active {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .stat {
        padding: 14px;
      }
      .stat span {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .stat strong {
        display: block;
        margin-top: 4px;
        font-size: 24px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 10px;
        text-align: left;
        vertical-align: middle;
      }
      th {
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.pending,
      .badge.confirmed {
        border-color: #ffc266;
        color: var(--warn);
        background: #fff8ec;
      }
      .badge.done {
        border-color: #8edbb2;
        color: var(--ok);
        background: #eefbf4;
      }
      .badge.canceled {
        color: var(--muted);
        background: #f3f4f6;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .row-actions {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 14px;
      }
      .notice {
        border: 1px solid #ffd89a;
        background: #fff9ef;
        border-radius: 8px;
        padding: 12px;
        color: #5d3b00;
        font-size: 13px;
      }
      .hidden {
        display: none !important;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 20;
        max-width: min(520px, calc(100vw - 32px));
        transform: translateX(-50%);
        border-radius: 999px;
        background: #111;
        color: #fff;
        padding: 10px 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      }
      @media (max-width: 820px) {
        .wrap {
          padding: 14px;
        }
        header,
        .row-actions {
          flex-direction: column;
        }
        .top-grid,
        .auth-grid,
        .summary {
          grid-template-columns: 1fr;
        }
        .tabs {
          overflow-x: auto;
        }
        th,
        td {
          min-width: 130px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div>
          <h1>직영점 AS 수거 신청</h1>
          <div class="sub">팀장님 입력 전용 사이트입니다. 데이터는 ERP DB 원장에 저장됩니다.</div>
        </div>
        <button class="btn" id="reloadBtn">새로고침</button>
      </header>

      <section class="panel card">
        <div class="grid auth-grid">
          <div>
            <label for="apiBase">ERP API 주소</label>
            <input id="apiBase" />
          </div>
          <div>
            <label for="accessCode">팀장용 접속코드</label>
            <input id="accessCode" type="password" autocomplete="current-password" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button class="btn primary" id="connectBtn">연결</button>
          </div>
        </div>
      </section>

      <nav class="tabs">
        <button class="btn tab active" data-tab="form">수거 신청</button>
        <button class="btn tab" data-tab="history">신청 이력</button>
      </nav>

      <section class="summary">
        <div class="panel stat"><span>전체</span><strong id="statTotal">0</strong></div>
        <div class="panel stat"><span>확인대기</span><strong id="statPending">0</strong></div>
        <div class="panel stat"><span>최종확인</span><strong id="statConfirmed">0</strong></div>
        <div class="panel stat"><span>입고완료</span><strong id="statDone">0</strong></div>
      </section>

      <section id="formTab" class="panel card">
        <div class="grid top-grid">
          <div>
            <label for="storeSelect">매장</label>
            <select id="storeSelect">
              <option value="">매장 선택</option>
            </select>
            <div class="muted" id="storeMeta"></div>
          </div>
          <div>
            <label for="confirmDate">확인일자</label>
            <input id="confirmDate" type="date" />
          </div>
          <div>
            <label for="requesterName">신청자</label>
            <input id="requesterName" placeholder="성명" />
          </div>
        </div>

        <div class="table-wrap" style="margin-top:16px">
          <table>
            <thead>
              <tr>
                <th style="min-width:260px">제품</th>
                <th style="min-width:150px">구분</th>
                <th style="min-width:130px">유/무상</th>
                <th style="min-width:90px">수량</th>
                <th style="min-width:220px">메모</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="itemBody"></tbody>
          </table>
        </div>

        <div class="row-actions">
          <button class="btn" id="addRowBtn">행 추가</button>
          <button class="btn primary" id="submitBtn">전체 신청 등록</button>
        </div>
      </section>

      <section id="historyTab" class="panel card hidden">
        <div class="notice">선택한 매장의 신청 이력만 표시합니다. 최종확인 이후 수정은 ERP 본사 화면에서 처리합니다.</div>
        <div class="table-wrap" style="margin-top:14px">
          <table>
            <thead>
              <tr>
                <th>번호</th>
                <th>매장</th>
                <th>제품</th>
                <th>구분</th>
                <th>수량</th>
                <th>상태</th>
                <th>확인일자</th>
                <th>수거예상</th>
                <th>입고</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script>
      const DEFAULT_API_BASE = "https://second-erp-production.up.railway.app";
      const divisions = ["즉시처리", "예외조치", "보상판매 에어릭스", "보상판매 R", "보상판매 H", "본사별도수거 박시영", "본사별도수거 이지영"];
      const charges = ["무상", "유상", "수거", "초기불량(팟)"];
      const state = {
        stores: [],
        products: [],
        requests: [],
        loading: false
      };

      const $ = (id) => document.getElementById(id);
      const today = () => new Date().toISOString().slice(0, 10);
      const savedApiBase = localStorage.getItem("asCollectionApiBase") || DEFAULT_API_BASE;
      $("apiBase").value = new URLSearchParams(location.search).get("api") || savedApiBase;
      $("accessCode").value = localStorage.getItem("asCollectionAccessCode") || "";
      $("confirmDate").value = today();

      function toast(message) {
        $("toast").textContent = message;
        $("toast").classList.remove("hidden");
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => $("toast").classList.add("hidden"), 2500);
      }

      function apiBase() {
        return $("apiBase").value.trim().replace(/\/$/, "");
      }

      function accessCode() {
        return $("accessCode").value.trim();
      }

      async function api(path, options = {}) {
        if (!apiBase()) throw new Error("ERP API 주소를 입력해 주세요.");
        if (!accessCode()) throw new Error("팀장용 접속코드를 입력해 주세요.");
        const res = await fetch(`${apiBase()}${path}`, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            "X-Direct-Store-AS-Collection-Passcode": accessCode(),
            ...(options.headers || {})
          }
        });
        const payload = await res.json().catch(() => null);
        if (!res.ok || !payload || payload.success === false) {
          throw new Error(payload?.error?.message || `요청 실패 (${res.status})`);
        }
        return payload.data;
      }

      function setLoading(value) {
        state.loading = value;
        document.querySelectorAll("button, input, select, textarea").forEach((el) => {
          if (el.id !== "accessCode" && el.id !== "apiBase") el.disabled = value;
        });
      }

      function optionHtml(value, label, selectedValue = "") {
        return `<option value="${escapeHtml(value)}"${value === selectedValue ? " selected" : ""}>${escapeHtml(label)}</option>`;
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        })[char]);
      }

      function renderStores() {
        const selected = $("storeSelect").value;
        $("storeSelect").innerHTML = `<option value="">매장 선택</option>` + state.stores
          .map((store) => optionHtml(store.storeCode, `${store.storeName} · ${store.region || "미분류"} · ${store.storeCode}`, selected))
          .join("");
        renderStoreMeta();
      }

      function renderStoreMeta() {
        const store = state.stores.find((item) => item.storeCode === $("storeSelect").value);
        $("storeMeta").textContent = store
          ? `${store.region || "미분류"} / ${store.deliveryRoute || store.deliveryDayOfWeek || "-"} / ${store.amsStoreCode || store.storeCode}`
          : "";
      }

      function productOptions(selected = "") {
        return `<option value="">제품 선택</option>` + state.products
          .map((product) => optionHtml(product.skuCode, `${product.name} · ${product.skuCode}`, selected))
          .join("");
      }

      function selectOptions(items, selected = "") {
        return items.map((item) => optionHtml(item, item, selected)).join("");
      }

      function addRow(row = {}) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><select class="product">${productOptions(row.productSkuCode || "")}</select></td>
          <td><select class="division">${selectOptions(divisions, row.division || divisions[0])}</select></td>
          <td><select class="charge">${selectOptions(charges, row.charge || charges[0])}</select></td>
          <td><input class="qty" type="number" min="1" value="${escapeHtml(row.qty || "1")}" /></td>
          <td><input class="memo" value="${escapeHtml(row.memo || "")}" /></td>
          <td><button class="btn remove" type="button">삭제</button></td>
        `;
        tr.querySelector(".remove").addEventListener("click", () => {
          if ($("itemBody").children.length > 1) tr.remove();
        });
        $("itemBody").appendChild(tr);
      }

      function rowsPayload() {
        return Array.from($("itemBody").querySelectorAll("tr"))
          .map((tr) => {
            const productSkuCode = tr.querySelector(".product").value;
            const product = state.products.find((item) => item.skuCode === productSkuCode);
            return {
              productSkuCode,
              productName: product?.name || "",
              division: tr.querySelector(".division").value,
              charge: tr.querySelector(".charge").value,
              qty: Number(tr.querySelector(".qty").value || 0),
              memo: tr.querySelector(".memo").value.trim()
            };
          })
          .filter((row) => row.productSkuCode || row.qty > 0 || row.memo);
      }

      function statusLabel(status) {
        return {
          pending: "확인대기",
          confirmed: "최종확인",
          pickup: "수거처리",
          done: "입고완료",
          canceled: "취소"
        }[status] || status;
      }

      function renderSummary(summary = {}) {
        $("statTotal").textContent = summary.total || 0;
        $("statPending").textContent = summary.pending || 0;
        $("statConfirmed").textContent = summary.confirmed || 0;
        $("statDone").textContent = summary.done || 0;
      }

      function renderHistory() {
        const rows = state.requests;
        $("historyBody").innerHTML = rows.length ? rows.map((item) => `
          <tr>
            <td><strong>${escapeHtml(item.seqId)}</strong></td>
            <td>${escapeHtml(item.storeName || "-")}<div class="muted">${escapeHtml(item.region || "미분류")} / ${escapeHtml(item.route || "-")}</div></td>
            <td>${escapeHtml(item.product)}<div class="muted">${escapeHtml(item.productSkuCode || "-")}</div></td>
            <td>${escapeHtml(item.division || "-")}<div class="muted">${escapeHtml(item.charge || "-")}</div></td>
            <td>${escapeHtml(item.qty)}</td>
            <td><span class="badge ${escapeHtml(item.status)}">${escapeHtml(statusLabel(item.status))}</span></td>
            <td>${escapeHtml(item.confirmDate || "-")}</td>
            <td>${escapeHtml(item.pickExpDate || "-")}</td>
            <td>${item.inboundQty == null ? "-" : `${escapeHtml(item.inboundQty)}개`}</td>
          </tr>
        `).join("") : `<tr><td colspan="9" class="muted" style="text-align:center;padding:32px">조회된 이력이 없습니다.</td></tr>`;
      }

      async function refresh() {
        setLoading(true);
        try {
          localStorage.setItem("asCollectionApiBase", apiBase());
          localStorage.setItem("asCollectionAccessCode", accessCode());
          const [stores, products] = await Promise.all([
            api("/api/direct-store-as-collection/stores"),
            api("/api/direct-store-as-collection/products?limit=1000")
          ]);
          state.stores = stores.items || [];
          state.products = products.items || [];
          renderStores();
          $("itemBody").innerHTML = "";
          addRow();
          await refreshHistory();
          toast("ERP API 연결 완료");
        } catch (error) {
          toast(error.message || "연결에 실패했습니다.");
        } finally {
          setLoading(false);
        }
      }

      async function refreshHistory() {
        const storeCode = $("storeSelect").value;
        if (!storeCode) {
          state.requests = [];
          renderSummary();
          renderHistory();
          return;
        }
        const data = await api(`/api/direct-store-as-collection?status=ALL&storeCode=${encodeURIComponent(storeCode)}&limit=300`);
        state.requests = data.items || [];
        renderSummary(data.summary || {});
        renderHistory();
      }

      async function submit() {
        const storeCode = $("storeSelect").value;
        if (!storeCode) {
          toast("매장을 선택해 주세요.");
          return;
        }
        const items = rowsPayload();
        if (!items.length || items.some((item) => !item.productSkuCode || item.qty < 1)) {
          toast("제품과 수량을 확인해 주세요.");
          return;
        }
        setLoading(true);
        try {
          await api("/api/direct-store-as-collection", {
            method: "POST",
            body: JSON.stringify({
              storeCode,
              confirmDate: $("confirmDate").value,
              requesterName: $("requesterName").value.trim(),
              items
            })
          });
          $("itemBody").innerHTML = "";
          addRow();
          await refreshHistory();
          toast(`${items.length}건 신청했습니다.`);
        } catch (error) {
          toast(error.message || "신청에 실패했습니다.");
        } finally {
          setLoading(false);
        }
      }

      document.querySelectorAll(".tab").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
          button.classList.add("active");
          $("formTab").classList.toggle("hidden", button.dataset.tab !== "form");
          $("historyTab").classList.toggle("hidden", button.dataset.tab !== "history");
          if (button.dataset.tab === "history") refreshHistory().catch((error) => toast(error.message));
        });
      });

      $("connectBtn").addEventListener("click", refresh);
      $("reloadBtn").addEventListener("click", refresh);
      $("addRowBtn").addEventListener("click", () => addRow());
      $("submitBtn").addEventListener("click", submit);
      $("storeSelect").addEventListener("change", () => {
        renderStoreMeta();
        refreshHistory().catch((error) => toast(error.message));
      });
      addRow();
    </script>
  </body>
</html>
